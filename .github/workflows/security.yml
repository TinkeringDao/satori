name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository with Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          curl -fsSL -o "$TMP_DIR/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $TMP_DIR/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$TMP_DIR/gitleaks.tar.gz" -C "$TMP_DIR" gitleaks
          "$TMP_DIR/gitleaks" dir --no-banner --redact .

      - name: Verify private-key and governance hygiene
        run: |
          set -euo pipefail

          if git grep -nI -E -e '-{5}BEGIN (RSA |DSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-{5}' -- \
            ':(exclude)third_party/**' ':(exclude)*.png' ':(exclude)*.jpg' ':(exclude)*.pdf'; then
            echo "ERROR: Private key header detected in tracked files." >&2
            exit 1
          fi

          for req in LEGAL.md LICENSE SECURITY.md CODE_OF_CONDUCT.md .github/CODEOWNERS; do
            if [[ ! -s "$req" ]]; then
              echo "ERROR: Required governance file '$req' is missing or empty." >&2
              exit 1
            fi
          done
          if ! grep -Fq "Apache License" LICENSE; then
            echo "ERROR: LICENSE must contain Apache-2.0 text." >&2
            exit 1
          fi
          if ! grep -Fq "Addendum: German Statutory References" LEGAL.md; then
            echo "ERROR: LEGAL.md is missing the German Statutory References Addendum." >&2
            exit 1
          fi

      - name: Verify cryptographic commit signatures on pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          COMMITS_JSON="$(gh api --paginate "repos/${BASE_REPO}/pulls/${PR_NUMBER}/commits")"
          UNVERIFIED="$(printf '%s' "$COMMITS_JSON" | jq '[.[] | select(.commit.verification.verified != true)] | length')"
          if [[ "$UNVERIFIED" != "0" ]]; then
            echo "ERROR: ${UNVERIFIED} commit(s) in PR #${PR_NUMBER} lack a verified cryptographic signature." >&2
            exit 1
          fi

      - name: Audit GitHub Actions workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pipx run zizmor==1.32.0 --min-severity medium .

      - name: Review dependency changes
        if: github.event_name == 'pull_request' && !github.event.repository.private
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
